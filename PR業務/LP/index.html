<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ぱんや ニチゲツ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    color: #3a2010;
  }
  .hero {
    text-align: center;
    padding: 3rem 1.5rem 2rem;
  }
  .hero .logo-mark {
    width: 120px;
    height: 120px;
    margin-bottom: .75rem;
  }
  .hero h1 {
    font-size: 1.9rem;
    letter-spacing: .2em;
    color: #7a4010;
    margin-bottom: .3rem;
  }
  .hero p {
    font-size: .95rem;
    color: #9a6a3a;
    letter-spacing: .1em;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 1.25rem 3rem;
  }
  .card {
    background: rgba(255,255,255,0.88);
    border: 1px solid #c8a878;
    border-radius: 18px;
    padding: 1.5rem 1.4rem;
    margin-bottom: 1.25rem;
    box-shadow: 0 4px 18px rgba(120,70,20,.1);
  }
  .card h2 {
    font-size: .85rem;
    letter-spacing: .15em;
    color: #9a6a3a;
    margin-bottom: .75rem;
  }
  .row {
    display: flex;
    gap: .75rem;
    align-items: flex-start;
    margin-bottom: .6rem;
    font-size: .95rem;
    line-height: 1.7;
  }
  .row:last-child { margin-bottom: 0; }
  .row .icon { flex-shrink: 0; }
  .note {
    background: #f5ede0;
    border-radius: 10px;
    padding: .7rem .9rem;
    font-size: .85rem;
    color: #7a4010;
    margin-top: .9rem;
    line-height: 1.6;
  }
  .btn {
    display: block;
    text-align: center;
    width: 100%;
    padding: .9rem;
    background: #7a4010;
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: .95rem;
    letter-spacing: .1em;
    margin-top: .5rem;
  }
  .btn:hover { background: #c87941; }
  .btn.outline {
    background: transparent;
    color: #7a4010;
    border: 1px solid #7a4010;
  }
  footer {
    text-align: center;
    font-size: .78rem;
    color: #9a6a3a;
    padding-bottom: 1.5rem;
  }
</style>
</head>
