{% extends "base.html" %}
{% block title %}管理ログイン{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:2rem auto;padding:1.6rem 1.4rem;text-align:center;">
  <h1 style="font-size:1.15rem;color:#7a4010;letter-spacing:.1em;margin-bottom:1.2rem;">管理ログイン</h1>
  <form method="post">
    <input type="password" name="password" placeholder="パスワード" autofocus
      style="width:100%;font-family:inherit;font-size:1rem;padding:.7rem .8rem;
             border:1.5px solid #d4b896;border-radius:12px;margin-bottom:1rem;">
    <button class="btn block" type="submit">ログイン</button>
  </form>
  <a href="{{ url_for('index') }}" class="muted" style="display:inline-block;margin-top:1rem;font-size:.8rem;">← ショップに戻る</a>
</div>
{% endblock %}
