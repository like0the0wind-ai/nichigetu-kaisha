<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>スタッフ管理 | ニチゲツ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      color: #3a2010; padding: 1.5rem 1rem;
    }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    h1 { font-size: 1.1rem; letter-spacing: .15em; color: #7a4010; }
    .back { color: #9a6a3a; font-size: .8rem; text-decoration: none; }
    .card {
      background: rgba(255,255,255,0.75); border: 1px solid #c8a878;
      border-radius: 14px; padding: 1.25rem; margin-bottom: 1.25rem;
      box-shadow: 0 2px 10px rgba(120,70,20,.1);
    }
    h2 { font-size: .95rem; color: #7a4010; margin-bottom: 1rem; font-weight: normal; letter-spacing: .1em; }
    .add-form { display: flex; gap: .75rem; flex-wrap: wrap; }
    input[type=text] {
      flex: 1; min-width: 160px; padding: .65rem .9rem;
      background: #faf5ee; border: 1px solid #c8a878;
      border-radius: 8px; color: #3a2010; font-size: 1rem; font-family: inherit;
    }
    .btn { padding: .65rem 1.25rem; background: #c87941; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: .95rem; font-family: inherit; }
    .error { color: #a04020; background: #ffe8e0; border-radius: 8px;
      padding: .6rem 1rem; margin-bottom: 1rem; font-size: .9rem; }
    .staff-list { display: flex; flex-direction: column; gap: .5rem; }
    .staff-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: .65rem 1rem; background: #faf5ee;
      border: 1px solid #e8d5b5; border-radius: 10px;
    }
    .staff-name { font-size: 1rem; }
    .del-btn {
      background: none; border: 1px solid #c09080; color: #a06050;
      border-radius: 6px; padding: .25rem .65rem; cursor: pointer; font-size: .8rem;
      font-family: inherit;
    }
    .empty { color: #9a7a5a; font-size: .9rem; padding: .5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>スタッフ管理</h1>
    <a class="back" href="/admin">← 管理者画面</a>
  </header>

  <div class="card">
    <h2>スタッフを追加</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" class="add-form">
      <input type="hidden" name="action" value="add">
      <input type="text" name="name" placeholder="名前" required>
      <button class="btn" type="submit">追加</button>
    </form>
  </div>

  <div class="card">
    <h2>登録スタッフ一覧</h2>
    {% if staff %}
    <div class="staff-list">
      {% for s in staff %}
      <div class="staff-item">
        <span class="staff-name">{{ s.name }}</span>
        <form method="post" onsubmit="return confirm('{{ s.name }} を削除しますか？')">
          <input type="hidden" name="action" value="delete">
          <input type="hidden" name="name" value="{{ s.name }}">
          <button class="del-btn" type="submit">削除</button>
        </form>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <div class="empty">スタッフが登録されていません</div>
    {% endif %}
  </div>
</body>
</html>
