<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>管理者ログイン | ニチゲツシステム</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      color: #3a2010;
    }
    h1 { font-size: 1.2rem; letter-spacing: .2em; margin-bottom: 2rem; color: #7a4010; }
    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid #c8a878;
      border-radius: 16px; padding: 2rem;
      width: min(340px, 92vw);
      box-shadow: 0 4px 24px rgba(120,70,20,.15);
    }
    input[type=password] {
      width: 100%; padding: .75rem 1rem;
      background: #faf5ee; border: 1px solid #c8a878;
      border-radius: 8px; color: #3a2010;
      font-size: 1rem; margin-bottom: 1rem;
    }
    button {
      width: 100%; padding: .85rem;
      background: #c87941; color: #fff;
      border: none; border-radius: 10px;
      font-size: 1rem; cursor: pointer;
      font-family: inherit; letter-spacing: .1em;
    }
    .error { color: #c03020; font-size: .85rem; margin-top: .75rem; text-align: center; }
    .back { display: block; margin-top: 1.5rem; text-align: center; color: #9a6a3a; font-size: .8rem; text-decoration: none; }
  </style>
</head>
<body>
  <h1>管理者ログイン</h1>
  <div class="card">
    <form method="post">
      <input type="password" name="password" placeholder="パスワード" required autofocus>
      <button type="submit">ログイン</button>
      {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </form>
    <a class="back" href="/">← 打刻画面へ戻る</a>
  </div>
</body>
</html>
