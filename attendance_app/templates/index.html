<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>打刻 | パン屋ニチゲツ</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#c87941">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ニチゲツ打刻">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      color: #3a2010; padding: 1.5rem 1rem;
    }
    h1 { font-size: 1.4rem; letter-spacing: .3em; margin-bottom: 2rem; color: #7a4010; }
    .card {
      background: rgba(255,255,255,0.8); backdrop-filter: blur(8px);
      border: 1px solid #c8a878; border-radius: 18px;
      padding: 2rem 1.75rem; width: min(400px, 94vw);
      box-shadow: 0 4px 24px rgba(120,70,20,.15);
    }

    /* スタッフ選択グリッド */
    .staff-label { font-size: .82rem; color: #9a6a3a; margin-bottom: .6rem; text-align: center; }
    .staff-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: .5rem; margin-bottom: 1.25rem;
    }
    .staff-btn {
      padding: .7rem .4rem; border: 2px solid #d4b896; border-radius: 12px;
      background: #faf5ee; color: #3a2010; font-size: .9rem;
      cursor: pointer; font-family: inherit; transition: all .12s;
      text-align: center; user-select: none;
    }
    .staff-btn:active { transform: scale(.95); }
    .staff-btn.selected { border-color: #c87941; background: #fff; box-shadow: 0 2px 10px rgba(200,121,65,.25); }

    /* フォールバック: テキスト入力 */
    .or-divider { text-align: center; font-size: .78rem; color: #b8987a; margin-bottom: .6rem; }
    input[type=text] {
      width: 100%; padding: .7rem 1rem;
      background: #faf5ee; border: 1px solid #c8a878;
      border-radius: 10px; color: #3a2010;
      font-size: 1rem; letter-spacing: .08em; margin-bottom: 1.1rem;
      font-family: inherit;
    }

    .btns { display: flex; gap: .65rem; margin-bottom: .6rem; }
    .btns-break { display: flex; gap: .65rem; }
    button.action {
      flex: 1; padding: .85rem .4rem;
      border: none; border-radius: 12px;
      font-size: .92rem; letter-spacing: .06em;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    button.action:hover { opacity: .85; }
    button.action:active { transform: scale(.97); }
    .btn-in    { background: #c87941; color: #fff; }
    .btn-out   { background: #4a7a4a; color: #fff; }
    .btn-break { background: #7a6a4a; color: #fff; font-size: .85rem; }

    .msg {
      margin-top: 1.1rem; padding: .7rem 1rem;
      background: #f0e5d0; border-radius: 10px;
      font-size: .88rem; text-align: center; color: #5a3010;
    }
    .admin-link {
      margin-top: 2rem; font-size: .8rem;
      color: #9a6a3a; text-decoration: none; letter-spacing: .05em;
    }
    .admin-link:hover { color: #7a4a1a; }
    #name-input { display: none; }
  </style>
</head>
<body>
  <h1>パン屋ニチゲツ</h1>
  <div class="card">
    <form method="post" id="form">
      <input type="hidden" name="name" id="selected-name" value="">

      {% if staff_rows %}
      <div class="staff-label">名前をタップして選択</div>
      <div class="staff-grid">
        {% for s in staff_rows %}
        <button type="button" class="staff-btn" data-name="{{ s.name }}"
          onclick="selectStaff(this)">{{ s.name }}</button>
        {% endfor %}
      </div>
      <div id="name-input">
        <div class="or-divider">または直接入力</div>
        <input type="text" id="manual-name" placeholder="名前" oninput="clearSelection()">
      </div>
      {% else %}
      <input type="text" name="name" placeholder="名前" required autofocus style="margin-bottom:1.1rem">
      {% endif %}

      <div class="btns">
        <button class="action btn-in"  name="action" value="clock_in">出勤</button>
        <button class="action btn-out" name="action" value="clock_out">退勤</button>
      </div>
      <div class="btns-break">
        <button class="action btn-break" name="action" value="break_start">休憩 開始</button>
        <button class="action btn-break" name="action" value="break_end">休憩 終了</button>
      </div>

      {% if msg %}
      <div class="msg">{{ msg }}</div>
      {% endif %}
    </form>
  </div>

  <a class="admin-link" href="/admin">管理者画面</a>

  <script>
    function selectStaff(btn) {
      document.querySelectorAll('.staff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('selected-name').value = btn.dataset.name;
      const manual = document.getElementById('manual-name');
      if (manual) manual.value = '';
    }
    function clearSelection() {
      document.querySelectorAll('.staff-btn').forEach(b => b.classList.remove('selected'));
      document.getElementById('selected-name').value = document.getElementById('manual-name').value;
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
