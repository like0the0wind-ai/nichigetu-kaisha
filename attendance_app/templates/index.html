<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>打刻 | パン屋ニチゲツ</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#c87941">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ニチゲツ打刻">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      color: #3a2010;
    }
    h1 { font-size: 1.4rem; letter-spacing: .3em; margin-bottom: 2rem; color: #7a4010; }
    .card {
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      border: 1px solid #c8a878;
      border-radius: 16px;
      padding: 2rem;
      width: min(380px, 92vw);
      box-shadow: 0 4px 24px rgba(120,70,20,.15);
    }
    input[type=text] {
      width: 100%; padding: .75rem 1rem;
      background: #faf5ee; border: 1px solid #c8a878;
      border-radius: 8px; color: #3a2010;
      font-size: 1.1rem; letter-spacing: .1em;
      margin-bottom: 1.2rem;
    }
    input[type=text]::placeholder { color: #b8987a; }
    .btns { display: flex; gap: .75rem; }
    button {
      flex: 1; padding: .85rem;
      border: none; border-radius: 10px;
      font-size: 1rem; letter-spacing: .1em;
      cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-in  { background: #c87941; color: #fff; }
    .btn-out { background: #4a7a4a; color: #fff; }
    .msg {
      margin-top: 1.2rem; padding: .75rem 1rem;
      background: #f0e5d0; border-radius: 8px;
      font-size: .9rem; text-align: center; color: #5a3010;
    }
    .admin-link {
      margin-top: 2.5rem; font-size: .8rem;
      color: #9a6a3a; text-decoration: none;
    }
    .admin-link:hover { color: #7a4a1a; }
  </style>
</head>
<body>
  <h1>パン屋ニチゲツ 打刻</h1>
  <div class="card">
    <form method="post">
      <input type="text" name="name" placeholder="名前" required autofocus>
      <div class="btns">
        <button class="btn-in"  name="action" value="clock_in">出勤</button>
        <button class="btn-out" name="action" value="clock_out">退勤</button>
      </div>
      {% if msg %}
      <div class="msg">{{ msg }}</div>
      {% endif %}
    </form>
  </div>
  <a class="admin-link" href="/admin">管理者画面</a>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
