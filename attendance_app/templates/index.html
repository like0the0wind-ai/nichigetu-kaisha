<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>打刻 | パン屋ニチゲツ</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#c87941">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ニチゲツ打刻">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #f5ede0 0%, #e8d5b5 50%, #d4b896 100%);
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      color: #3a2010;
      padding-bottom: 120px;
    }
    header {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 1rem 1.25rem;
      text-align: center;
      border-bottom: 1px solid #c8a878;
      position: sticky; top: 0; z-index: 10;
    }
    h1 { font-size: 1.1rem; letter-spacing: .2em; color: #7a4010; }

    .staff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 1rem;
      padding: 1.25rem;
    }
    .staff-card {
      background: rgba(255,255,255,0.85);
      border: 2px solid #d4b896;
      border-radius: 18px;
      padding: 1.25rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: all .15s;
      user-select: none;
      -webkit-user-select: none;
    }
    .staff-card:active { transform: scale(.96); }
    .staff-card.selected {
      border-color: #c87941;
      background: #fff;
      box-shadow: 0 4px 20px rgba(200,121,65,.25);
    }
    .staff-name { font-size: 1.1rem; margin-bottom: .6rem; font-weight: bold; }
    .status-badge {
      display: inline-block;
      padding: .25rem .8rem;
      border-radius: 20px;
      font-size: .75rem;
      letter-spacing: .05em;
    }
    .status-out   { background: #e8d5b5; color: #7a5a3a; }
    .status-in    { background: #4a7a4a; color: #fff; }
    .status-break { background: #c87941; color: #fff; }

    /* アクションパネル（下から出てくる） */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.3);
      z-index: 20;
      opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .action-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fff;
      border-radius: 24px 24px 0 0;
      padding: 1.5rem 1.25rem;
      padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      z-index: 30;
      box-shadow: 0 -4px 30px rgba(0,0,0,.15);
    }
    .action-panel.show { transform: translateY(0); }

    .panel-handle {
      width: 40px; height: 4px;
      background: #d4b896; border-radius: 2px;
      margin: 0 auto 1.25rem;
    }
    .panel-name {
      font-size: 1.1rem; color: #7a4010;
      text-align: center; margin-bottom: 1rem;
      letter-spacing: .1em;
    }
    .action-btns {
      display: flex; gap: .75rem;
      flex-wrap: wrap;
    }
    .action-btns button {
      flex: 1; min-width: 120px;
      padding: 1rem;
      border: none; border-radius: 14px;
      font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: opacity .15s;
      letter-spacing: .05em;
    }
    .action-btns button:active { opacity: .75; }
    .btn-in    { background: #c87941; color: #fff; }
    .btn-out   { background: #4a7a4a; color: #fff; }
    .btn-break { background: #7a6a4a; color: #fff; }

    /* トースト通知 */
    .toast {
      position: fixed; bottom: 140px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(58,32,16,.9); color: #f5ede0;
      padding: .75rem 1.5rem; border-radius: 24px;
      font-size: .9rem; white-space: nowrap;
      opacity: 0; transition: all .3s;
      z-index: 40; pointer-events: none;
    }
    .toast.show {
      opacity: 1; transform: translateX(-50%) translateY(0);
    }

    .admin-link {
      display: block; text-align: center;
      padding: .75rem; color: #9a6a3a;
      font-size: .8rem; text-decoration: none;
    }
    .empty-msg {
      text-align: center; color: #9a6a3a;
      padding: 3rem 1rem; font-size: .95rem;
      line-height: 2;
    }
    .empty-msg a { color: #c87941; }
  </style>
</head>
<body>
  <header>
    <h1>パン屋ニチゲツ 打刻</h1>
  </header>

  {% if staff_status %}
  <div class="staff-grid">
    {% for s in staff_status %}
    <div class="staff-card" data-name="{{ s.name }}" data-status="{{ s.status }}" onclick="selectStaff(this)">
      <div class="staff-name">{{ s.name }}</div>
      <span class="status-badge status-{{ s.status }}">
        {%- if s.status == 'in' -%}出勤中
        {%- elif s.status == 'break' -%}休憩中
        {%- else -%}出勤前{%- endif -%}
      </span>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty-msg">
    スタッフが登録されていません<br>
    <a href="/admin">管理者画面で登録してください</a>
  </div>
  {% endif %}

  <a class="admin-link" href="/admin">管理者画面</a>

  <!-- オーバーレイ -->
  <div class="overlay" id="overlay" onclick="closePanel()"></div>

  <!-- アクションパネル -->
  <div class="action-panel" id="actionPanel">
    <div class="panel-handle"></div>
    <div class="panel-name" id="panelName"></div>
    <form method="post" id="actionForm">
      <input type="hidden" name="name" id="nameInput">
      <div class="action-btns" id="actionBtns"></div>
    </form>
  </div>

  {% if msg %}
  <div class="toast" id="toast">{{ msg }}</div>
  {% endif %}

  <script>
    let selectedCard = null;

    function selectStaff(card) {
      if (selectedCard) selectedCard.classList.remove('selected');
      selectedCard = card;
      card.classList.add('selected');

      const name   = card.dataset.name;
      const status = card.dataset.status;

      document.getElementById('panelName').textContent = name;
      document.getElementById('nameInput').value = name;

      const btns = document.getElementById('actionBtns');
      btns.innerHTML = '';

      if (status === 'out') {
        btns.innerHTML = `<button class="btn-in" name="action" value="clock_in">出勤</button>`;
      } else if (status === 'in') {
        btns.innerHTML = `<button class="btn-break" name="action" value="break_start">休憩開始</button>
                          <button class="btn-out"   name="action" value="clock_out">退勤</button>`;
      } else if (status === 'break') {
        btns.innerHTML = `<button class="btn-break" name="action" value="break_end">休憩終了</button>
                          <button class="btn-out"   name="action" value="clock_out">退勤</button>`;
      }

      document.getElementById('overlay').classList.add('show');
      document.getElementById('actionPanel').classList.add('show');
    }

    function closePanel() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('actionPanel').classList.remove('show');
      if (selectedCard) {
        selectedCard.classList.remove('selected');
        selectedCard = null;
      }
    }

    // トースト表示
    const toast = document.getElementById('toast');
    if (toast) {
      setTimeout(() => toast.classList.add('show'), 100);
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
</body>
</html>
